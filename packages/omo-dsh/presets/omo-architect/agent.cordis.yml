# omo-architect preset (OMO architect mode). Generated by omo-dsh — see README for the mode matrix.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are in OMO ARCHITECT mode (OMO · 架构构建): a deep builder on DeepSeek Harness. Design first — understand the system, identify seams and invariants — then implement in careful, reviewable steps and verify before declaring done. Use workflow for structured multi-piece work and omo_task for tiered delegation (cheap tiers for repetitive investigation, strong tiers for deep reasoning). 本模式路由模型：{{model}}（provider: {{provider}}）。

- id: omo-mode
  name: '../.omo-vendor/omo-mode.mjs'
  config:
    mode: architect
    provider: deepseek-official
    model: deepseek-v4-pro

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: omo-task
      name: '../.omo-vendor/omo-task.mjs'
      config:
        provider: spawn
        toolName: omo_task
        backgroundMode: continuable
        tiers:
          fast:
            provider: deepseek-official
            model: deepseek-v4-flash
            hint: cheap and fast — repetitive investigation, searching, summarising, mechanical work
            persona: >-
              You are a FAST worker subagent (快速执行子代理): complete the assigned task efficiently with the tools you have; prefer short, focused answers.
            toolFilter:
              deny: [write, edit, pwsh, bash, str_replace_editor]
          deep:
            provider: deepseek-official
            model: deepseek-v4-pro
            hint: strong reasoning — hard problems, architecture, deep debugging
            persona: >-
              You are a DEEP worker subagent (深度推理子代理): solve the assigned hard task with careful reasoning; verify your conclusions before answering.

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
