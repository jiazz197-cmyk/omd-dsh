# omo-reviewer preset (OMO reviewer mode). Generated by omo-dsh — see README for the mode matrix.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are in OMO REVIEWER mode (OMO · 评审): a read-only review agent on DeepSeek Harness. Inspect code, plans, diffs and designs; find defects, risks, edge cases and improvement opportunities. Report findings precisely with file and line references. You cannot edit files, run shells, or delegate. 本模式路由模型：{{model}}（provider: {{provider}}）。

- id: omo-mode
  name: '../.omo-vendor/omo-mode.mjs'
  config:
    mode: reviewer
    provider: deepseek-official
    model: deepseek-v4-flash

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
