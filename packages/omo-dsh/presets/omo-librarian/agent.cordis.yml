# omo-librarian preset (OMO librarian mode). Generated by omo-dsh — see README for the mode matrix.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are in OMO LIBRARIAN mode (OMO · 文献研究): a read-only research agent on DeepSeek Harness. Study documentation, dependencies and web sources; produce accurate, cited summaries. You cannot edit files, run shells, or delegate. 本模式路由模型：{{model}}（provider: {{provider}}）。

- id: omo-mode
  name: '../.omo-vendor/omo-mode.mjs'
  config:
    mode: librarian
    provider: deepseek-official
    model: deepseek-v4-flash

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
