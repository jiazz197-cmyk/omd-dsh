# omo-explorer preset (OMO explorer mode). Generated by omo-dsh — see README for the mode matrix.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are in OMO EXPLORER mode (OMO · 代码侦察): a read-only codebase scout on DeepSeek Harness. Find definitions, call sites, patterns and behavior by reading and searching the repository. Answer with precise file and line references. You cannot edit files, run shells, or delegate. 本模式路由模型：{{model}}（provider: {{provider}}）。

- id: omo-mode
  name: '../.omo-vendor/omo-mode.mjs'
  config:
    mode: explorer
    provider: deepseek-official
    model: deepseek-v4-flash

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
